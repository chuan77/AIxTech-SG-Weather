<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Lepak app icon "Hammock Sun": the sun lying in a hammock (lepak = to chill).
       Full-bleed background so it also works as a maskable icon: all artwork stays inside the
       central 80% circle (radius 205 around 256,256). Three flat layers (sky, sun, hammock), no
       baked gloss, so iOS and Android can add their own depth.
       Render to PNGs with scripts/icons/render-icons.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4b68"/>
      <stop offset="1" stop-color="#202a36"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffb547" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="236" r="150" fill="url(#glow)"/>
  <circle cx="256" cy="238" r="76" fill="#ffb547"/>
  <path d="M104 236Q256 432 408 236" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
</svg>
